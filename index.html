<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0e0c">
<title>Calisthenics</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app-shell">
<header class="topbar"><div><div class="eyebrow">CALISTHENICS · GYMNAST STRENGTH</div><h1 id="pageTitle">This Week</h1></div><button id="settingsBtn" class="icon-btn">•••</button></header>
<nav class="main-nav"><button class="nav-btn active" data-view="week">Week</button><button class="nav-btn" data-view="progress">Progress</button></nav>
<section id="weekView" class="view active"></section><section id="progressView" class="view"></section>
</main>
<dialog id="workoutDialog" class="sheet-dialog"><div class="sheet-head"><button id="closeWorkoutBtn" class="text-btn">← Week</button><div id="workoutHeadMeta" class="sheet-head-meta"></div></div><div id="workoutContent"></div></dialog>
<dialog id="settingsDialog" class="sheet-dialog"><div class="sheet-head"><button id="closeSettingsBtn" class="text-btn">← Back</button><strong>Settings</strong></div><div class="settings-wrap"><div class="setting-card"><h3>Measurements</h3><p class="muted">Optional. Update only when useful.</p><div class="field-grid"><label>Weight (lb)<input id="weightInput" inputmode="decimal"></label><label>Waist (in)<input id="waistInput" inputmode="decimal"></label></div><button id="saveMeasuresBtn" class="primary-btn">Save</button></div><div class="setting-card"><h3>Backup</h3><p class="muted">History is stored on this device.</p><div class="button-row"><button id="exportBtn" class="secondary-btn">Export backup</button><label class="secondary-btn file-btn">Import backup<input id="importInput" type="file" accept="application/json" hidden></label></div></div><div class="setting-card"><button id="resetBtn" class="danger-btn">Clear local history</button></div></div></dialog>
<script src="data/profile.js"></script><script src="data/exercises.js"></script><script src="data/weeks/week-29-30.js"></script><script src="data/weeks/week-31-32.js"></script><script src="app.js"></script>
</body></html>
